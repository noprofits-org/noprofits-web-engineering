version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (security-sensitive: the auth
  # action runs with id-token: write).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep the site's npm deps (and the pinned firebase-tools) current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
