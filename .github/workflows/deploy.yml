name: Deploy to Firebase Hosting

# Deploys the built site to the `noprofits-web` Firebase Hosting project on
# every push to main (i.e. after a gated PR merges) and on manual dispatch.
#
# Auth = keyless Workload Identity Federation (no service-account JSON key,
# nothing secret committed) — mirrors the proven gwc-platform / gantt pattern.
#
# ── ONE-TIME ENABLEMENT before the first real deploy (Google side, on noprofits-web) ──
#   1. Enable APIs:  firebasehosting.googleapis.com, iamcredentials.googleapis.com
#      (iamcredentials is required for WIF→SA impersonation or firebase-tools
#       fails with a misleading "have you run firebase login?")
#   2. Create a deploy service account with roles/firebasehosting.admin.
#   3. Create a WIF pool+provider bound to noprofits-org/noprofits-web-engineering.
#      Pin the trust to the protected branch — add an attribute condition
#      `assertion.ref == 'refs/heads/main'` (and `assertion.repository_owner ==
#      'noprofits-org'`) so only main can mint the deploy credential, not any
#      branch via workflow_dispatch. (The job-level `if` below is the in-repo
#      half of this; the provider condition is the authoritative half.)
#   4. Grant the repo principalSet roles/iam.workloadIdentityUser on the SA.
#   5. Set repo VARIABLES (Settings ▸ Secrets and variables ▸ Actions ▸ Variables):
#         GCP_WIF_PROVIDER    = projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#         GCP_DEPLOY_SA       = <sa>@noprofits-web.iam.gserviceaccount.com
#         PUBLIC_FORM_ENDPOINT = the deployed Apps Script /exec URL (also receives
#                                the first-party analytics beacon — one endpoint)
# These are non-secret identifiers; security comes from the pool's repo+ref binding.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for WIF

# One deploy at a time; a newer push cancels an in-flight run so an older build
# can't land after a newer one.
concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    # Only main may deploy — blocks workflow_dispatch from an arbitrary branch
    # receiving the id-token. (Pair with the provider's assertion.ref condition.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags); the trailing
      # comment records the human-readable version. Bump via Dependabot.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # The deployed Apps Script /exec URL (a repo Variable, not a Secret —
          # it ships in the client bundle). Build guard fails if unset/placeholder.
          # The analytics beacon shares this same endpoint, so there is nothing
          # else to wire — set this one and both the form and analytics work.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          # The live analytics dashboard's /exec URL (a separate standalone Apps
          # Script, gated "Anyone with a Google account"). A public link, so a
          # Variable, not a Secret. If unset, the /stats page omits the button.
          PUBLIC_DASH_URL: ${{ vars.PUBLIC_DASH_URL }}

      # Install tooling (pinned) BEFORE the credential-exporting auth step, so a
      # compromised firebase-tools release can't run with ADC in scope.
      - run: npm install -g firebase-tools@15.22.0

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          export_environment_variables: true

      - name: Deploy
        # firebase-tools reads ADC from the auth step's credentials file and
        # mints its own firebase-scoped token.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only hosting --project noprofits-web --non-interactive
